<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="الحاسبة الذكية - منظومة إنجز للإنتاجية والحلول البرمجية">
    <title>الحاسبة الذكية - منظومة إنجز (ENGZ Calculator)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body class="dark-mode">
    <div class="calculator">
        <!-- Top Bar -->
        <div class="calc-top-bar">
            <div class="menu-title">
                <span class="brand-badge"><i class="fa-solid fa-bolt"></i> إنجز</span>
                <span class="calc-type" id="calcType">الحاسبة القياسية</span>
            </div>
            <div class="top-actions">
                <button class="icon-btn lang-toggle" id="langToggle" onclick="toggleLanguage()" title="Language / الترجمة">🌐 AR</button>
                <button class="icon-btn theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Theme / المظهر">🌙</button>
            </div>
        </div>

        <!-- Display -->
        <div class="display-container">
            <input type="text" id="display" disabled value="0" placeholder="0">
        </div>

        <!-- Memory Bar -->
        <div class="memory-bar">
            <button class="mem-btn disabled">MC</button>
            <button class="mem-btn disabled">MR</button>
            <button class="mem-btn">M+</button>
            <button class="mem-btn">M-</button>
            <button class="mem-btn">MS</button>
            <button class="mem-btn disabled">M▼</button>
        </div>

        <!-- Buttons Grid (LTR Layout: Operators on the Right) -->
        <div class="buttons-grid">
            <!-- Row 1 -->
            <button class="btn btn-op" onclick="percentage()">%</button>
            <button class="btn btn-op" onclick="clearEntry()">CE</button>
            <button class="btn btn-op" onclick="clearDisplay()">C</button>
            <button class="btn btn-op" onclick="deleteDigit()">⌫</button>

            <!-- Row 2 -->
            <button class="btn btn-op" onclick="reciprocal()">¹/x</button>
            <button class="btn btn-op" onclick="square()">x²</button>
            <button class="btn btn-op" onclick="sqrt()">²√x</button>
            <button class="btn btn-op" onclick="appendOperator('/')">÷</button>

            <!-- Row 3 -->
            <button class="btn btn-num" onclick="appendNumber('7')">7</button>
            <button class="btn btn-num" onclick="appendNumber('8')">8</button>
            <button class="btn btn-num" onclick="appendNumber('9')">9</button>
            <button class="btn btn-op" onclick="appendOperator('*')">✕</button>

            <!-- Row 4 -->
            <button class="btn btn-num" onclick="appendNumber('4')">4</button>
            <button class="btn btn-num" onclick="appendNumber('5')">5</button>
            <button class="btn btn-num" onclick="appendNumber('6')">6</button>
            <button class="btn btn-op" onclick="appendOperator('-')">-</button>

            <!-- Row 5 -->
            <button class="btn btn-num" onclick="appendNumber('1')">1</button>
            <button class="btn btn-num" onclick="appendNumber('2')">2</button>
            <button class="btn btn-num" onclick="appendNumber('3')">3</button>
            <button class="btn btn-plus" onclick="appendOperator('+')">+</button>

            <!-- Row 6 -->
            <button class="btn btn-num" onclick="toggleSign()">+/ -</button>
            <button class="btn btn-num" onclick="appendNumber('0')">0</button>
            <button class="btn btn-num" onclick="appendNumber('.')">.</button>
            <button class="btn btn-equals" onclick="calculate()">=</button>
        </div>
    </div>
    <div class="eco-quick-bar">
        <a href="../engz app/index.html" class="floating-btn home-btn"><i class="fa-solid fa-house"></i> إنجز الرئيسية</a>
        <a href="../to do list/index.html" class="floating-btn task-btn"><i class="fa-solid fa-list-check"></i> قائمة المهام 📝</a>
    </div>
    <script src="index.js"></script>
</body>
</html>
